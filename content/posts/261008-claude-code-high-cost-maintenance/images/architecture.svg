<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="960" height="470" fill="#FFFFFF"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">服务端能看到的：要么断网，要么一台新加坡家庭里的机器</text>

  <!-- 国内 zone -->
  <rect x="30" y="60" width="360" height="310" rx="12" fill="#F5F8FF" stroke="#7AA2F7" stroke-width="1.5"/>
  <text x="52" y="90" font-size="15" font-weight="700" fill="#3B5BDB">国内</text>

  <rect x="60" y="115" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#7AA2F7" stroke-width="1.5"/>
  <text x="145" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">开发机</text>
  <text x="145" y="163" text-anchor="middle" font-size="12" fill="#52606d">Claude Code 在这里跑</text>

  <rect x="60" y="245" width="170" height="78" rx="8" fill="#FFFFFF" stroke="#7AA2F7" stroke-width="1.5"/>
  <text x="145" y="271" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">独立网关</text>
  <text x="145" y="291" text-anchor="middle" font-size="12" fill="#52606d">OpenWrt</text>
  <text x="145" y="309" text-anchor="middle" font-size="12" fill="#C92A2A">宁可断网，不可泄露</text>

  <line x1="145" y1="177" x2="145" y2="241" stroke="#7AA2F7" stroke-width="2"/>
  <polygon points="145,245 140,236 150,236" fill="#7AA2F7"/>

  <!-- tunnel -->
  <line x1="230" y1="284" x2="598" y2="284" stroke="#9AA5B1" stroke-width="5"/>
  <polygon points="606,284 594,278 594,290" fill="#9AA5B1"/>
  <text x="415" y="270" text-anchor="middle" font-size="13" fill="#52606d">加密隧道（Tailscale）</text>

  <!-- 新加坡 zone -->
  <rect x="570" y="60" width="360" height="310" rx="12" fill="#F4FBF6" stroke="#4CAF7D" stroke-width="1.5"/>
  <text x="592" y="90" font-size="15" font-weight="700" fill="#2F9E44">新加坡朋友家</text>

  <rect x="610" y="115" width="150" height="62" rx="8" fill="#FFFFFF" stroke="#4CAF7D" stroke-width="1.5"/>
  <text x="685" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">小主机</text>
  <text x="685" y="163" text-anchor="middle" font-size="12" fill="#52606d">只做出口，无风扇</text>

  <rect x="610" y="245" width="150" height="62" rx="8" fill="#FFFFFF" stroke="#4CAF7D" stroke-width="1.5"/>
  <text x="685" y="271" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">家庭宽带</text>
  <text x="685" y="293" text-anchor="middle" font-size="12" fill="#52606d">住宅 IP</text>

  <line x1="685" y1="177" x2="685" y2="241" stroke="#4CAF7D" stroke-width="2"/>
  <polygon points="685,245 680,236 690,236" fill="#4CAF7D"/>

  <!-- IP-KVM -->
  <rect x="795" y="115" width="120" height="62" rx="8" fill="#FFFFFF" stroke="#868E96" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="855" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">IP-KVM</text>
  <text x="855" y="163" text-anchor="middle" font-size="12" fill="#52606d">物理兜底</text>
  <line x1="760" y1="146" x2="791" y2="146" stroke="#868E96" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- server -->
  <rect x="585" y="405" width="240" height="46" rx="23" fill="#FFF4E5" stroke="#F2994A" stroke-width="1.5"/>
  <text x="705" y="434" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Claude 服务端</text>

  <line x1="685" y1="307" x2="685" y2="401" stroke="#F2994A" stroke-width="2"/>
  <polygon points="685,405 680,396 690,396" fill="#F2994A"/>
  <text x="700" y="365" font-size="12" fill="#B25E09">所有信号都指向：新加坡住宅身份</text>
</svg>
