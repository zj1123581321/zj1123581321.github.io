baseURL = 'https://zj1123581321.com/'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
theme = 'PaperMod'

[languages]
  [languages.zh]
    languageCode = 'zh-CN'
    languageName = '简体中文'
    weight = 1
    title = '杂谈by立行'

    [languages.zh.params]
      description = "记录一个数字生活流民的所见，所思。"

      [languages.zh.params.homeInfoParams]
        Title = "杂谈by立行"
        Content = "记录一个数字生活流民的所见，所思。"

    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 30
    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 40

  [languages.en]
    languageCode = 'en'
    languageName = 'English'
    weight = 2
    title = "Lixing's Blog"

    [languages.en.params]
      description = "Notes and thoughts from a digital nomad. Most of my writing is in Chinese — see the Chinese homepage for more."

      [languages.en.params.homeInfoParams]
        Title = "Lixing's Blog"
        Content = "Notes and thoughts from a digital nomad. Most of my writing is in Chinese — see the [Chinese homepage](/) for more."

    [[languages.en.menu.main]]
      identifier = "archives"
      name = "Archives"
      url = "/archives/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 40

[pagination]
  pagerSize = 10

[params]
  env = "production"
  author = "立行"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  comments = true

  [params.giscus]
    repo = "zj1123581321/zj1123581321.github.io"
    repoId = "R_kgDOHRqMOA"
    category = "Announcements"
    categoryId = "DIC_kwDOHRqMOM4C5dcC"
    mapping = "pathname"

  [[params.socialIcons]]
    name = "wechat"
    title = "公众号: 杂谈by立行"
    url = "/about/#-联系我呀"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zj1123581321"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
